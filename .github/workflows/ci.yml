# File: .github/workflows/ci.yml

name: Build, SCA, SAST Pipeline

on:
  push:
    branches:
      - fomo-ci

jobs:
  # ============================================
  # JOB 1: Build and Testing
  # ============================================
  build-and-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: veracode-demo-labs/verademo-java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./app
        run: mvn -B clean verify --file pom.xml

  # ============================================
  # JOB 2: Software Composition Analysis (SCA)
  # ============================================
  software-composition-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: veracode-demo-labs/verademo-java

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: ./app
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v3
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: low   # Fail on ANY vulnerability

  # ============================================
  # JOB 3: Upload Artifact (only if Grype found nothing)
  # ============================================
  upload-artifact:
    runs-on: ubuntu-latest
    needs: [build-and-testing, software-composition-analysis]
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: veracode-demo-labs/verademo-java

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-artifact
          path: ./app/target/*.war
          if-no-files-found: error

  # ============================================
  # JOB 4: SAST with SonarQube
  # ============================================
  sast-sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: fhpeto/verademo-java #using my forked repo to introduce sonarcloud integration
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar